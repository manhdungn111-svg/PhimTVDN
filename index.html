<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XemPhim</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<style>
:root{--r:#ee2a24;--c:#161616;--m:#8d8d8d;--bg:#000;--tx:#fff;--ln:#262626}html.lt{--c:#f0f0f3;--m:#6e6e78;--bg:#fff;--tx:#111;--ln:#e3e3e8}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px -apple-system,system-ui,Roboto,sans-serif}
#app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:84px;position:relative}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.fx{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px}
#hd{top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 22px;background:linear-gradient(var(--bg),transparent)}
#hd.solid{background:var(--bg)}
.logo{font-weight:900;font-size:24px;letter-spacing:-1px;flex:1}.logo b{color:var(--r)}
.src{background:var(--r);border-radius:8px;padding:8px 10px;font-weight:700}
.ib{width:30px;height:30px}
svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bn{bottom:0;z-index:10;display:flex;background:var(--c);backdrop-filter:blur(10px);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
#bn button{flex:1;color:var(--m);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
#bn button svg{width:28px;height:28px}#bn .on{color:var(--r);font-weight:700}
.pad{padding-top:74px}
.msg{color:var(--m);text-align:center;padding:50px 20px}
/* hero */
.hero{position:relative;aspect-ratio:3/4;overflow:hidden}
.hs{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .6s;cursor:pointer}
.hs.on{opacity:1}
.ht{position:absolute;left:18px;right:90px;bottom:60px}
.ht h2{font-size:26px;line-height:1.15;text-shadow:0 2px 8px #000}.ht p{color:#ccc;margin-top:8px}
.bp{position:absolute;right:20px;bottom:50px;width:62px;height:62px;border-radius:50%;background:var(--r);display:grid;place-items:center;font-size:24px;padding-left:4px}
.dots{position:absolute;right:20px;bottom:22px;display:flex;gap:8px}.dots i{width:9px;height:9px;border-radius:5px;background:#fff5;transition:.3s}.dots i.on{width:22px;background:#fff}
/* rows */
section{margin-top:22px}
.rh{display:flex;justify-content:space-between;align-items:center;padding:0 14px 12px;cursor:pointer}.rh h3{font-size:22px}.rh span{font-size:28px;line-height:1}
.rw{display:flex;gap:12px;overflow-x:auto;padding:0 14px;scrollbar-width:none}.rw::-webkit-scrollbar{display:none}
.pc{flex:0 0 31%;cursor:pointer}.pc img,.g img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--c);display:block}
.pc p,.g p{font-size:13px;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tp{flex:0 0 46%;position:relative;height:200px;cursor:pointer}.tp b{position:absolute;left:0;bottom:0;font-size:150px;line-height:.8;color:transparent;-webkit-text-stroke:3px #999;font-style:italic}
.tp img{position:absolute;right:0;top:0;width:62%;height:100%;object-fit:cover;border-radius:12px}
.cw{flex:0 0 74%;cursor:pointer}.cwi{position:relative;aspect-ratio:16/9;border-radius:12px;background:var(--c) center/cover;overflow:hidden}
.cwi i{position:absolute;left:0;bottom:0;height:4px;background:var(--r)}.pp{position:absolute;inset:0;margin:auto;width:54px;height:54px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;background:#0006;padding-left:3px}
.cw p{margin-top:8px;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* grid / overlays */
.ov{top:0;bottom:0;background:var(--bg);overflow:auto;display:none}#sub{z-index:20}#det{z-index:30}
.tb2{display:flex;gap:10px;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;position:sticky;top:0;background:var(--bg);z-index:2}
.tb2 h3{font-size:19px}.tb2 input{flex:1;background:var(--c);border:0;border-radius:22px;padding:11px 16px;color:var(--tx);font:inherit;outline:0}
.bk{font-size:30px;width:34px;line-height:1}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:6px 14px}.g>div{cursor:pointer}
.more{display:block;margin:18px auto;background:var(--c);border-radius:22px;padding:11px 28px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px}
.ct{aspect-ratio:1/1.25;border-radius:14px;padding:14px 12px;font-weight:700;font-size:17px;position:relative;overflow:hidden;cursor:pointer}
.ct:after{content:attr(data-i);position:absolute;right:-6px;bottom:-14px;font-size:76px;opacity:.28}
/* detail */
.pl{position:sticky;top:0;z-index:3;background:#000;aspect-ratio:16/9;margin-top:env(safe-area-inset-top)}
.pl video,.pl iframe{width:100%;height:100%;border:0;background:#000;display:block}.pl .bk{position:absolute;top:2px;left:8px;z-index:4;text-shadow:0 0 6px #000}
.di{padding:16px 14px}.di h1{font-size:24px;line-height:1.25}
.chips{display:flex;gap:10px;align-items:center;margin:14px 0}.chips span{background:var(--c);border-radius:4px;padding:3px 9px;font-weight:700;color:var(--m)}
.chips .rt{margin-left:auto;background:none;border:1px solid #888;border-radius:6px;color:var(--tx);padding:6px 12px}
.ds{color:var(--tx);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.ds.x{display:block}
.mi{color:var(--m);margin-top:8px;line-height:1.4}.mi b{color:var(--tx)}
.ac{display:flex;margin:22px 0 10px}.ac button{flex:1;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}.ac em{font-size:24px;font-style:normal;color:var(--tx)}.ac .on em{color:var(--r)}
.tbs{display:flex;gap:30px;border-bottom:1px solid var(--ln);margin:18px 0 0;overflow-x:auto}.tbs span{padding:12px 0;font-weight:800;font-size:20px;color:var(--m);cursor:pointer;white-space:nowrap}.tbs span.on{color:var(--tx);border-bottom:3px solid var(--r)}
.sv{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.sv button{background:var(--c);border-radius:16px;padding:6px 14px;font-size:14px}.sv .on{background:var(--r)}
.ep{display:flex;gap:14px;padding:10px 0;cursor:pointer;align-items:flex-start}.ep.on{background:#8882;margin:0 -14px;padding:10px 14px}
.et{position:relative;flex:0 0 42%;aspect-ratio:16/9;border-radius:10px;background:var(--c) center/cover;overflow:hidden}
.et i{position:absolute;right:8px;bottom:8px;background:#000a;border-radius:12px;padding:2px 9px;font-style:normal;font-size:13px}.et u{position:absolute;inset:0;background:#000a;display:grid;place-items:center;text-decoration:none}
.ep p{font-size:15px;line-height:1.3}.ep small{color:var(--m);font-size:15px;display:block;margin-top:8px}
/* tv */
.tabs{display:flex;gap:24px;overflow-x:auto;padding:14px 14px 0;border-bottom:1px solid var(--ln);scrollbar-width:none}.tabs span{padding-bottom:10px;color:var(--m);font-size:18px;white-space:nowrap;cursor:pointer}.tabs span.on{color:var(--tx);font-weight:800;border-bottom:3px solid var(--r)}
.sec{padding:0 14px}.sec h3{font-size:22px;margin:22px 0 12px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tl{position:relative;background:var(--c);border-radius:12px;aspect-ratio:11/6;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;cursor:pointer;border:2px solid transparent;text-align:center}
.tl.on{border-color:var(--r)}.tl img{max-width:80%;max-height:56%;object-fit:contain}.tl small{font-size:11px;color:var(--m);margin-top:4px;line-height:1.1;max-height:2.2em;overflow:hidden}
.hv{position:absolute;top:4px;right:7px;color:#555;font-size:16px}.hv.on{color:var(--r)}
.ld{margin:14px;background:var(--c);border-radius:12px;padding:12px 14px}.ld summary{cursor:pointer;font-weight:600}
.ld input[type=text]{width:100%;margin:10px 0;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;color:var(--tx);font:inherit}
.ld .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--m);font-size:14px}.ld .r button{background:var(--r);border-radius:8px;padding:8px 14px;color:var(--tx)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff7a45,#ee2a24);font-weight:800;display:grid;place-items:center}
.mu{color:var(--m)}
.pf{text-align:center;padding:20px 20px 6px}.big{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,#ff7a45,#ee2a24);display:grid;place-items:center;font-size:36px;font-weight:800}
.fm{padding:0 18px}.fm input{width:100%;margin-top:12px;background:var(--c);border:1px solid var(--ln);border-radius:10px;padding:13px;color:var(--tx);font:inherit;outline:0}.fm input:focus{border-color:var(--r)}
.pb{width:100%;background:var(--r);border-radius:10px;padding:13px;margin-top:16px;font-weight:700}
.er{color:#ff6b6b;min-height:20px;margin-top:10px;font-size:14px;text-align:center}
.st{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;color:var(--m);font-size:13px;padding:14px}.st b{display:block;color:var(--tx);font-size:22px}
.mn button,.mn summary{display:block;width:100%;text-align:left;padding:16px 18px;border-top:1px solid var(--ln);font-size:16px;cursor:pointer;list-style:none}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#333;padding:10px 18px;border-radius:20px;z-index:99;display:none}

.ht,.src,.bp,.av,.big,.pb,.ct,.pl .bk,.seg .on{color:#fff}
.av{position:relative}.av.nd:after{content:'';position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:#2d9cff;border:2px solid var(--bg)}
.avs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 18px 8px}.avs button{width:42px;height:42px;border-radius:50%;background:var(--c);font-size:22px}.avs .on{outline:2px solid var(--r)}
.seg{display:flex;gap:8px;padding:10px 18px}.seg button{flex:1;padding:9px;border-radius:10px;background:var(--c)}.seg .on{background:var(--r)}
.fs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 14px}.fs select{width:100%;padding:12px;border-radius:10px;background:var(--c);color:var(--tx);border:1px solid var(--ln);font:inherit}
.nt{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--ln);cursor:pointer;align-items:center}.nt.un{background:#ee2a2418}.nt img{width:44px;height:62px;object-fit:cover;border-radius:6px}.nt small{color:var(--m);display:block;margin-top:4px}
.sheet{position:fixed;inset:0;background:#0008;z-index:60;display:flex;align-items:flex-end;justify-content:center}.sh{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px}.sh input{width:100%;margin-top:12px;padding:13px;border-radius:10px;background:var(--c);border:1px solid var(--ln);color:var(--tx);font:inherit}
</style>
</head>
<body>
<div id="app">
  <header id="hd" class="fx"><div class="logo">Xem<b>Phim</b></div><button class="src" id="sb"></button><button class="ib" id="fl"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button><button class="ib" id="sr"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button><button class="av" id="av"></button></header>
  <main id="main"></main>
  <nav id="bn" class="fx"></nav>
</div>
<div id="sub" class="ov fx"></div><div id="det" class="ov fx"></div><div id="toast"></div>

<script>
const $=s=>document.querySelector(s), K='https://phimapi.com', N='https://phim.nguonc.com/api';
const PER=['cw','lk','wl','fav','fl','rm','nt'];let U=null;
const kx=k=>PER.includes(k)&&U?`u:${U}:${k}`:k;
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(kx(k)))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(kx(k),JSON.stringify(v))}catch{}if(PER.includes(k))sched()},del:k=>{try{localStorage.removeItem(kx(k))}catch{}}};
U=ls.get('session',null);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const S={src:ls.get('src','kk'),tab:'home'};
const img=(u,b='https://phimimg.com/')=>!u?'':/^https?:/.test(u)?u:b+u.replace(/^\/+/,'');
const j=async u=>{const r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()};
const toast=t=>{const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)};
const IC={home:'<path d="M4 11l8-7 8 7v9H4z"/>',tv:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/>',phim:'<rect x="3" y="9" width="18" height="11" rx="2"/><path d="M3 9l2-5 4 5 4-5 4 5"/>',sport:'<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/>',cat:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'};
const TABS=[['home','Trang chủ'],['tv','TV & Sự kiện'],['phim','Phim'],['sport','Thể thao'],['cat','Danh mục']];
$('#bn').innerHTML=TABS.map(([k,n])=>`<button data-t="${k}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${n}</button>`).join('');

/* ===== Dữ liệu ===== */
const cache={};
function list(path,page=1,q=''){
  const key=[S.src,path,page,q].join('|');
  return cache[key]||(cache[key]=(async()=>{
    const kk=S.src==='kk';let d;
    if(q) d=kk?(await j(`${K}/v1/api/tim-kiem?keyword=${encodeURIComponent(q)}&page=${page}&limit=24`)).data:await j(`${N}/films/search?keyword=${encodeURIComponent(q)}&page=${page}`);
    else if(path==='moi') d=await j(kk?`${K}/danh-sach/phim-moi-cap-nhat?page=${page}`:`${N}/films/phim-moi-cap-nhat?page=${page}`);
    else{const p=path.includes('/')?path:'danh-sach/'+path,sp=p.includes('?')?'&':'?';d=kk?(await j(`${K}/v1/api/${p}${sp}page=${page}&limit=24`)).data:await j(`${N}/films/${p}${sp}page=${page}`)}
    const b=d.APP_DOMAIN_CDN_IMAGE?d.APP_DOMAIN_CDN_IMAGE+'/':'https://phimimg.com/';
    return (d.items||[]).map(m=>({name:m.name,slug:m.slug,thumb:img(m.thumb_url,b),bg:img(m.poster_url,b),year:m.year||'',cur:m.episode_current||m.current_episode||''}));
  })().catch(x=>{delete cache[key];throw x}));
}
async function detail(s,src=S.src){
  if(src==='kk'){
    const d=await j(`${K}/phim/${s}`),m=d.movie;
    return {name:m.name,desc:m.content,thumb:img(m.thumb_url),bg:img(m.poster_url),q:m.quality,total:m.episode_total,rate:m.tmdb?.vote_average?(+m.tmdb.vote_average).toFixed(1):'',time:m.time,
      actors:(m.actor||[]).join(', '),dir:(m.director||[]).join(', '),country:(m.country||[]).map(x=>x.name).join(', '),genres:(m.category||[]).map(x=>x.name),
      servers:(d.episodes||[]).map(v=>({name:v.server_name,eps:v.server_data.map(x=>({name:x.name,m3u8:x.link_m3u8,embed:x.link_embed}))}))};
  }
  const d=await j(`${N}/film/${s}`),m=d.movie,g=Object.values(m.category||{}),by=r=>(g.find(x=>r.test(x.group?.name||''))?.list||[]).map(x=>x.name);
  return {name:m.name,desc:m.description,thumb:img(m.thumb_url),bg:img(m.poster_url),q:m.quality,total:m.total_episodes?m.total_episodes+' tập':'',rate:'',time:m.time,
    actors:m.casts||'',dir:m.director||'',country:by(/Quốc gia/i).join(', '),genres:by(/Thể loại/i),
    servers:(m.episodes||[]).map(v=>({name:v.server_name,eps:v.items.map(x=>({name:x.name,m3u8:x.m3u8,embed:x.embed}))}))};
}

/* ===== Trang chủ / Phim ===== */
let hT=null,hls=null;
const heroH=h=>`<div class="hero">${h.map((m,i)=>`<div class="hs ${i?'':'on'}" data-s="${m.slug}" style="background-image:linear-gradient(transparent 55%,var(--bg)),url('${m.thumb}')"><div class="ht"><h2>${e(m.name)}</h2><p>${e(m.cur)}${m.year?' • '+m.year:''}</p></div><span class="bp">▶</span></div>`).join('')}<div class="dots">${h.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div></div>`;
const rowH=([p,t,ty],a)=>a.length?`<section><div class="rh" data-l="${p}" data-t="${e(t)}"><h3>${t}</h3><span>›</span></div><div class="rw">${ty==='top'?a.slice(0,10).map((m,i)=>`<div class="tp" data-s="${m.slug}"><b>${i+1}</b><img src="${m.thumb}" alt=""></div>`).join(''):a.slice(0,14).map(m=>`<div class="pc" data-s="${m.slug}"><img loading="lazy" src="${m.thumb}" alt=""><p>${e(m.name)}</p></div>`).join('')}</div></section>`:'';
const cwH=()=>{const a=ls.get('cw',[]);return a.length?`<section><div class="rh"><h3>Xem tiếp</h3></div><div class="rw">${a.map((m,i)=>`<div class="cw" data-cw="${i}"><div class="cwi" style="background-image:url('${m.bg||m.thumb}')"><span class="pp">▶</span><i style="width:${Math.round((m.p||0)*100)}%"></i></div><p>${e(m.name)}</p></div>`).join('')}</div></section>`:''};
async function feed(defs,cw){
  const m=$('#main');m.innerHTML='<div class="msg">Đang tải…</div>';
  const res=await Promise.all(defs.map(d=>list(d[0]).catch(()=>[])));
  const hero=(res.find(r=>r.length)||[]).slice(0,6);
  if(!hero.length){m.innerHTML='<div class="msg">Không tải được API. Hãy mở file bằng trình duyệt có mạng, hoặc đổi nguồn (nút đỏ ở góc phải).</div>';return}
  m.innerHTML=heroH(hero)+(cw?cwH():'')+defs.map((d,i)=>rowH(d,res[i])).join('');
  let i=0;const hs=[...m.querySelectorAll('.hs')],dt=[...m.querySelectorAll('.dots i')];
  hT=setInterval(()=>{hs[i].classList.remove('on');dt[i].classList.remove('on');i=(i+1)%hs.length;hs[i].classList.add('on');dt[i].classList.add('on')},5000);
}

/* ===== Danh mục ===== */
const CATS=[['Phim bộ','phim-bo','#ee2a24','📺'],['Phim lẻ','phim-le','#c9000d','🎬'],['Hoạt hình','hoat-hinh','#2fb585','🧸'],['TV Shows','tv-shows','#4a0d9e','🎤'],['Hành động','the-loai/hanh-dong','#1b1f8a','💥'],['Tình cảm','the-loai/tinh-cam','#e91e63','💕'],['Kinh dị','the-loai/kinh-di','#1a1a5e','👻'],['Cổ trang','the-loai/co-trang','#b98300','🏯'],['Viễn tưởng','the-loai/vien-tuong','#2aa9d8','🚀'],['Hàn Quốc','quoc-gia/han-quoc','#b86cc9','🇰🇷'],['Trung Quốc','quoc-gia/trung-quoc','#e88a1f','🇨🇳'],['Âu Mỹ','quoc-gia/au-my','#34b98a','🇺🇸'],['Nhật Bản','quoc-gia/nhat-ban','#8db600','🇯🇵'],['Thái Lan','quoc-gia/thai-lan','#0aa0dc','🇹🇭']];
const catH=()=>`<div class="pad"></div><button class="pb" data-fl style="margin:0 14px 14px;width:calc(100% - 28px)">⚙ Bộ lọc: thể loại · quốc gia · năm</button><div class="cats">${CATS.map(c=>`<div class="ct" data-l="${c[1]}" data-t="${c[0]}" data-i="${c[3]}" style="background:${c[2]}">${c[0]}</div>`).join('')}<div class="ct" data-go="tv" data-i="📡" style="background:#ee2a24">TV & Sự kiện</div></div>`;

/* ===== Trang con: danh sách + tìm kiếm ===== */
const gc=m=>`<div data-s="${m.slug}"><img loading="lazy" src="${m.thumb}" alt=""><p>${e(m.name)}</p></div>`;
function listPage(path,title){
  const o=$('#sub');o.style.display='block';o.scrollTop=0;
  o.innerHTML=`<div class="tb2"><button class="bk">‹</button><h3>${e(title)}</h3></div><div class="g" id="g"></div><button class="more" id="mo">Xem thêm</button>`;
  let pg=0;const more=async()=>{pg++;$('#mo').textContent='Đang tải…';
    try{const a=await list(path,pg);$('#g').insertAdjacentHTML('beforeend',a.map(gc).join(''));$('#mo').textContent=a.length?'Xem thêm':'Hết phim'}catch{$('#mo').textContent='Lỗi – bấm để thử lại';pg--}};

}
function searchPage(){

/* ===== Trình phát chung ===== */
function kill(){if(hls){hls.destroy();hls=null}}
function attach(box,url,emb){
  kill();
  if(url){
    box.innerHTML='<video controls autoplay playsinline></video>';const v=box.firstChild;
    if(window.Hls&&Hls.isSupported()&&/m3u8/i.test(url)){hls=new Hls();hls.loadSource(url);hls.attachMedia(v);
      hls.on(Hls.Events.ERROR,(_,x)=>{if(x.fatal&&emb)box.innerHTML=`<iframe src="${emb}" allowfullscreen allow="autoplay;fullscreen"></iframe>`})}
    else v.src=url;
    return v;
  }
  box.innerHTML=emb?`<iframe src="${emb}" allowfullscreen allow="autoplay;fullscreen"></iframe>`:'<div class="msg">Không có nguồn phát</div>';
}

function saveCw(v){
  if(!v.duration)return;
  const a=ls.get('cw',[]).filter(x=>!(x.slug===C.s&&x.src===S.src));
  a.unshift({src:S.src,slug:C.s,name:C.d.name,thumb:C.d.thumb,bg:C.d.bg,si:C.si,ei:C.ei,t:v.currentTime,p:v.currentTime/v.duration,ts:Date.now()});ls.set('cw',a.slice(0,50));
}
function playEp(si,ei,t=0){
  C.si=si;C.ei=ei;const ep=C.d.servers[si]?.eps[ei],box=$('#pv');
  if(!ep){box.querySelector('video,iframe,.msg')?.remove();box.insertAdjacentHTML('beforeend','<div class="msg">Phim chưa có tập nào</div>');return}
  const v=attach(box,ep.m3u8,ep.embed);box.insertAdjacentHTML('afterbegin','<button class="bk">⌄</button>');
  if(v){let last=0;
    v.onloadedmetadata=()=>{if(t>5&&t<v.duration-10)v.currentTime=t};
    v.ontimeupdate=()=>{if(Date.now()-last>5000){last=Date.now();saveCw(v)}};
    v.onended=()=>{if(C.d.servers[C.si].eps[C.ei+1])playEp(C.si,C.ei+1)};
  }
  tabBody();
}
async function tabBody(){
  const b=$('#tbody');if(!b||!C)return;

    const sv=C.d.servers;
    b.innerHTML=(sv.length>1?`<div class="sv">${sv.map((s,i)=>`<button data-sv="${i}" class="${i===C.si?'on':''}">${e(s.name)}</button>`).join('')}</div>`:'')+

  }

let CH=ls.get('ch',[]),FAV=ls.get('fav',[]),GR='Tất cả',tvSport=false;
function parseM3U(t){const o=[];let c=null;
  for(const l of t.split(/\r?\n/)){const s=l.trim();if(!s)continue;
    if(s.startsWith('#EXTINF')){const a=k=>(s.match(new RegExp(k+'="([^"]*)"'))||[])[1]||'';c={name:s.split(',').slice(1).join(',').trim()||a('tvg-name'),logo:a('tvg-logo'),group:a('group-title')||'Khác'}}
    else if(!s.startsWith('#')){o.push({...(c||{name:s,logo:'',group:'Khác'}),url:s});c=null}}
  return o}
const SPORT=/thể thao|the thao|sport|bein|espn|fox|k\+|premier|champions|f1|bóng|vtv6|tv360\s?\d/i;
function tvPage(sport){
  tvSport=sport;GR='Tất cả';const m=$('#main');
  m.innerHTML=`<div class="pad" style="padding-top:66px"></div><div class="pl" id="tvp" style="top:0;margin-top:0"><div class="msg" style="padding:12% 0">Chọn kênh để phát</div></div><div style="padding:8px 14px 0;font-weight:700" id="tvn"></div>
  <details class="ld" ${CH.length?'':'open'}><summary>＋ Nạp danh sách kênh (M3U / M3U8)</summary><input type="text" id="mu" placeholder="Dán link M3U (https://…)" value="${e(ls.get('m3u',''))}"><div class="r"><button id="ml">Tải từ link</button><span>hoặc</span><input type="file" id="mf" accept=".m3u,.m3u8,.txt"></div></details>
  <div class="tabs" id="gt"></div><div id="tvb"></div>`;
  $('#ml').onclick=async()=>{const u=$('#mu').value.trim();if(!u)return;try{const t=await (await fetch(u)).text();setCH(t,u)}catch{toast('Không tải được (CORS?). Hãy tải file về rồi chọn file.')}};
  $('#mf').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setCH(r.result,'');r.readAsText(f)};
  tvDraw();
}
function setCH(t,u){const a=parseM3U(t);if(!a.length)return toast('File không hợp lệ');CH=a;ls.set('ch',a);if(u)ls.set('m3u',u);toast('Đã nạp '+a.length+' kênh');GR='Tất cả';tvDraw()}
function tvDraw(){
  const src=CH.map((c,i)=>({...c,i})).filter(c=>!tvSport||SPORT.test(c.group+' '+c.name));
  const gs=[...new Set(src.map(c=>c.group))];
  $('#gt').innerHTML=['Tất cả',...gs].map(g=>`<span class="${g===GR?'on':''}" data-g="${e(g)}">${e(g)}</span>`).join('');
  const tile=c=>`<div class="tl" data-u="${c.i}" id="ch${c.i}">${c.logo?`<img loading="lazy" src="${e(c.logo)}" onerror="this.style.display='none'" alt="">`:''}<small>${e(c.name)}</small><b class="hv ${FAV.includes(c.url)?'on':''}" data-f="${c.i}">♥</b></div>`;
  const sec=(t,a)=>a.length?`<div class="sec"><h3>${e(t)}</h3><div class="tg">${a.slice(0,90).map(tile).join('')}</div></div>`:'';
  let h='';
  if(!src.length)h='<div class="msg">Chưa có kênh. Hãy nạp danh sách M3U ở trên.</div>';
  else if(GR==='Tất cả')h=sec('Yêu thích',src.filter(c=>FAV.includes(c.url)))+gs.map(g=>sec(g,src.filter(c=>c.group===g))).join('');
  else h=sec(GR,src.filter(c=>c.group===GR));
  $('#tvb').innerHTML=h;
}
function playTv(i){
  const c=CH[i];document.querySelectorAll('.tl.on').forEach(x=>x.classList.remove('on'));document.querySelectorAll('#ch'+i).forEach(x=>x.classList.add('on'));
  $('#tvn').textContent=c.name;attach($('#tvp'),c.url,'');
}

const users=()=>ls.get('users',{});
async function hp(pw,salt){const b=new TextEncoder().encode(salt+pw);if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of b)h=(h*33^c)>>>0;return 'x'+h}
const initial=()=>U?(users()[U]?.av||String(users()[U]?.name||U)[0].toUpperCase()):'👤';
const setAv=()=>{$('#av').textContent=initial();$('#av').classList.toggle('nd',nt().some(x=>!x.r))};
function logout(){U=null;ls.del('session');FAV=ls.get('fav',[]);setAv();profilePage();render();toast('Đã đăng xuất')}
async function doAuth(mode){
  const u=$('#au').value.trim().toLowerCase(),p=$('#ap').value,us=users(),er=m=>$('#ae').textContent=m;
  if(!/^[a-z0-9_.]{3,20}$/.test(u))return er('Tên đăng nhập 3–20 ký tự: chữ thường, số, _ hoặc .');
  if(p.length<6)return er('Mật khẩu tối thiểu 6 ký tự');
  if(mode==='reg'){
    if(us[u])return er('Tên đăng nhập đã tồn tại');
    if(p!==$('#ap2').value)return er('Mật khẩu nhập lại không khớp');
    const salt=Math.random().toString(36).slice(2);us[u]={salt,hash:await hp(p,salt),name:$('#an').value.trim()||u,at:Date.now(),stk:await hp(p,'sync:'+u)};ls.set('users',us);
  }else{const r=us[u];if(!r||r.hash!==await hp(p,r.salt))return er('Sai tên đăng nhập hoặc mật khẩu');r.stk=await hp(p,'sync:'+u);ls.set('users',us)}
  U=u;ls.set('session',u);FAV=ls.get('fav',[]);setAv();toast('Xin chào '+users()[u].name);profilePage();render();sync(true).then(()=>{FAV=ls.get('fav',[]);render()});
}

  o.innerHTML=`<div class="tb2"><button class="bk">‹</button><h3>Bộ lọc phim</h3></div><div class="fs">${sel('type','',TYP)}${sel('y','Mọi năm',yr,1)}${sel('g','Mọi thể loại',GEN.map(n=>[n,slug(n)]),1)}${sel('c','Mọi quốc gia',CTY.map(n=>[n,slug(n)]),1)}<button class="pb" id="fa" style="grid-column:1/3;margin-top:4px">Lọc phim</button></div>${S.src==='ng'?'<p class="mu" style="padding:0 14px;font-size:12px">NguonC chỉ lọc theo 1 tiêu chí (ưu tiên thể loại → quốc gia → năm). KKPhim lọc kết hợp được nhiều tiêu chí.</p>':''}<div class="g" id="g"></div><button class="more" id="mo" style="display:none">Xem thêm</button>`;
  let pg=0,path='';
  const more=async()=>{pg++;$('#mo').textContent='Đang tải…';try{const a=await list(path,pg);$('#g').insertAdjacentHTML('beforeend',a.map(gc).join(''));if(pg===1&&!a.length)$('#g').innerHTML='<div class="msg" style="grid-column:1/4">Không có phim phù hợp</div>';$('#mo').textContent=a.length?'Xem thêm':'Hết phim'}catch{$('#mo').textContent='Lỗi – bấm để thử lại';pg--}};
  $('#mo').onclick=more;
  $('#fa').onclick=()=>{FL={type:$('#f_type').value,g:$('#f_g').value,c:$('#f_c').value,y:$('#f_y').value};ls.set('flt',FL);path=filterPath(FL);pg=0;$('#g').innerHTML='';$('#mo').style.display='block';more()};
}

/* ===== Thông báo + nhắc lịch ===== */
const nt=()=>ls.get('nt',[]),epCount=d=>Math.max(0,...d.servers.map(x=>x.eps.length));
const askNotif=()=>{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()};
function pushNt(txt,slug,src){const a=nt();a.unshift({id:Date.now()+Math.random(),txt,slug,src,ts:Date.now(),r:0});ls.set('nt',a.slice(0,50));setAv();toast('🔔 '+txt);
  if(window.Notification&&Notification.permission==='granted'){try{new Notification('XemPhim',{body:txt})}catch{}}}
function toggleFollow(b){
  const a=ls.get('fl',[]),i=a.findIndex(x=>x.slug===C.s&&x.src===S.src);
  if(i>=0){a.splice(i,1);ls.set('fl',a);b.classList.remove('on');b.querySelector('em').textContent='🔕';toast('Đã bỏ theo dõi')}
  else{a.push({slug:C.s,src:S.src,name:C.d.name,thumb:C.d.thumb,n:epCount(C.d)});ls.set('fl',a);b.classList.add('on');b.querySelector('em').textContent='🔔';askNotif();toast('Sẽ báo khi có tập mới')}
}
function ics(n,at,s){
  const f=t=>new Date(t).toISOString().replace(/[-:]|\.\d+/g,'');
  const t=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//XemPhim//VN\r\nBEGIN:VEVENT\r\nUID:${at}-${s}@xemphim\r\nDTSTAMP:${f(Date.now())}\r\nDTSTART:${f(at)}\r\nDTEND:${f(at+72e5)}\r\nSUMMARY:Xem phim: ${n.replace(/[,;\n]/g,' ')}\r\nBEGIN:VALARM\r\nTRIGGER:-PT10M\r\nACTION:DISPLAY\r\nDESCRIPTION:Đến giờ xem phim\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/calendar'}));a.download='nhac-phim.ics';a.click();
}
function remindSheet(){
  const d=new Date(Date.now()+36e5);d.setMinutes(0);const v=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
  const o=document.createElement('div');o.className='sheet';
  o.innerHTML=`<div class="sh"><h3 style="margin-bottom:4px">⏰ Nhắc xem: ${e(C.d.name)}</h3><input type="datetime-local" id="rt" value="${v}"><button class="pb" id="rk">Đặt nhắc</button><button class="pb" id="ri" style="background:var(--c);color:var(--tx)">Thêm vào lịch điện thoại (.ics)</button><button id="rc" style="width:100%;padding:14px;color:var(--m)">Đóng</button></div>`;
  document.body.appendChild(o);const get=()=>new Date($('#rt').value).getTime();
  o.onclick=ev=>{if(ev.target===o)o.remove()};$('#rc').onclick=()=>o.remove();
  $('#rk').onclick=()=>{const at=get();if(!at||at<Date.now())return toast('Hãy chọn thời gian trong tương lai');const a=ls.get('rm',[]);a.push({id:Date.now(),slug:C.s,src:S.src,name:C.d.name,at});ls.set('rm',a);askNotif();toast('Đã đặt nhắc');o.remove()};
  $('#ri').onclick=()=>{const at=get();if(at)ics(C.d.name,at,C.s)};
}
function checkRm(){const a=ls.get('rm',[]),now=Date.now();let ch=0;a.forEach(r=>{if(!r.done&&r.at<=now){r.done=1;ch=1;pushNt('⏰ Đến giờ xem: '+r.name,r.slug,r.src)}});if(ch)ls.set('rm',a)}
async function checkNew(){
  const fl=ls.get('fl',[]);let ch=0;
  for(const f of fl){try{const n=epCount(await detail(f.slug,f.src));if(n>(f.n||0)){pushNt(`${f.name}: có tập mới (${n} tập)`,f.slug,f.src);f.n=n;ch=1}}catch{}}
  if(ch)ls.set('fl',fl);
  if(!ls.get('nm',1))return;
  try{delete cache[S.src+'|moi|1|'];const a=(await list('moi')).slice(0,10),k='seen_'+S.src,seen=ls.get(k,null);ls.set(k,a.map(m=>m.slug));
    if(seen){const nw=a.filter(m=>!seen.includes(m.slug));if(nw.length)pushNt('Phim mới: '+nw.slice(0,3).map(m=>m.name).join(', ')+(nw.length>3?'…':''),nw[0].slug,S.src)}}catch{}
}
setInterval(checkRm,30000);setInterval(checkNew,6e5);setTimeout(()=>{checkRm();checkNew()},3000);
function ntPage(){
  const o=$('#sub');o.style.display='block';o.scrollTop=0;
  const a=nt(),rm=ls.get('rm',[]).filter(r=>!r.done).sort((x,y)=>x.at-y.at),fl=ls.get('fl',[]),fmt=t=>new Date(t).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
  o.innerHTML=`<div class="tb2"><button class="bk">‹</button><h3>Thông báo</h3></div>${window.Notification&&Notification.permission==='default'?'<button class="pb" id="nq" style="margin:0 14px 6px;width:calc(100% - 28px)">Cho phép thông báo của trình duyệt</button>':''}
  <label class="mu" style="display:flex;gap:10px;padding:12px 14px;align-items:center"><input type="checkbox" id="nm" ${ls.get('nm',1)?'checked':''}> Báo khi có phim mới cập nhật</label>
  ${rm.length?'<h3 style="padding:8px 14px">Nhắc lịch</h3>'+rm.map(r=>`<div class="nt" data-s="${r.slug}" data-src="${r.src}"><div style="flex:1">${e(r.name)}<small>⏰ ${fmt(r.at)}</small></div><button data-rd="${r.id}" style="font-size:20px;color:var(--m)">✕</button></div>`).join(''):''}
  ${fl.length?'<h3 style="padding:14px 14px 8px">Đang theo dõi</h3>'+fl.map((f,i)=>`<div class="nt" data-s="${f.slug}" data-src="${f.src}"><img src="${f.thumb}" alt=""><div style="flex:1">${e(f.name)}<small>${f.n} tập hiện có</small></div><button data-fd="${i}" style="font-size:20px;color:var(--m)">✕</button></div>`).join(''):''}
  <h3 style="padding:14px 14px 8px">Mới nhất</h3>${a.length?a.map(x=>`<div class="nt ${x.r?'':'un'}" data-s="${x.slug}" data-src="${x.src}"><div style="flex:1">${e(x.txt)}<small>${fmt(x.ts)}</small></div></div>`).join(''):'<div class="msg">Chưa có thông báo</div>'}
  <p class="mu" style="padding:14px;font-size:12px">Thông báo hoạt động khi trang web đang mở. Để nhận khi đã đóng trình duyệt, hãy dùng “Thêm vào lịch (.ics)”.</p>`;
  o.querySelectorAll('[data-rd]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();ls.set('rm',ls.get('rm',[]).filter(r=>String(r.id)!==b.dataset.rd));ntPage()});
  o.querySelectorAll('[data-fd]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const x=ls.get('fl',[]);x.splice(+b.dataset.fd,1);ls.set('fl',x);ntPage()});
  $('#nm').onchange=ev=>ls.set('nm',ev.target.checked?1:0);
  if($('#nq'))$('#nq').onclick=()=>Notification.requestPermission().then(ntPage);
  a.forEach(x=>x.r=1);ls.set('nt',a);setAv();
}

/* ===== Lịch sử xem ===== */
function histPage(){
  const o=$('#sub');o.style.display='block';o.scrollTop=0;const a=ls.get('cw',[]);
  o.innerHTML=`<div class="tb2"><button class="bk">‹</button><h3 style="flex:1">Lịch sử xem</h3>${a.length?'<button id="hc" style="color:var(--r)">Xóa hết</button>':''}</div><div style="padding:0 14px">`+(a.length?a.map((m,i)=>`<div class="ep" data-cw="${i}"><div class="cwi" style="flex:0 0 42%;background-image:url('${m.bg||m.thumb}')"><i style="width:${Math.round((m.p||0)*100)}%"></i></div><div style="flex:1"><p>${e(m.name)}</p><small>Tập ${(m.ei||0)+1} · ${Math.floor((m.t||0)/60)} phút${m.ts?' · '+new Date(m.ts).toLocaleDateString('vi-VN'):''}</small></div><button data-hd="${i}" style="font-size:20px;color:var(--m);padding:2px 8px">✕</button></div>`).join(''):'<div class="msg">Chưa có lịch sử xem</div>')+'</div>';
  o.querySelectorAll('[data-hd]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const x=ls.get('cw',[]);x.splice(+b.dataset.hd,1);ls.set('cw',x);histPage()});
  if($('#hc'))$('#hc').onclick=()=>{if(confirm('Xóa toàn bộ lịch sử xem?')){ls.set('cw',[]);histPage()}};
}

/* ===== Đồng bộ + sao lưu ===== */
let syncing=false,sT;
const snap=()=>({cw:ls.get('cw',[]),lk:ls.get('lk',[]),wl:ls.get('wl',[]),fav:ls.get('fav',[]),fl:ls.get('fl',[]),rm:ls.get('rm',[]),nt:ls.get('nt',[]),pf:U?{av:users()[U]?.av||''}:null});
function applySnap(d){
  const un=(k,key)=>{const m=new Map();[...ls.get(k,[]),...(d[k]||[])].forEach(x=>{const id=key(x),o=m.get(id);if(!o||(x.ts||0)>(o.ts||0))m.set(id,x)});return [...m.values()]};
  ls.set('cw',un('cw',x=>x.src+x.slug).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,50));
  ['lk','wl','fl'].forEach(k=>ls.set(k,un(k,x=>x.src+x.slug)));ls.set('rm',un('rm',x=>x.id));ls.set('nt',un('nt',x=>x.id).sort((a,b)=>b.ts-a.ts).slice(0,50));
  ls.set('fav',[...new Set([...ls.get('fav',[]),...(d.fav||[])])]);FAV=ls.get('fav',[]);
  if(d.pf?.av&&U){const us=users();if(us[U]&&!us[U].av){us[U].av=d.pf.av;ls.set('users',us)}}
  setAv();
}
function sched(){if(!U||syncing||!ls.get('syn',''))return;clearTimeout(sT);sT=setTimeout(()=>sync(true),4000)}
async function sync(silent){
  const url=String(ls.get('syn','')).replace(/\/$/,''),r=users()[U];if(!url||!U||!r?.stk||syncing)return;syncing=true;
  try{
    const g=await fetch(`${url}/sync?user=${encodeURIComponent(U)}&token=${r.stk}`);
    if(g.status===401)throw Error('sai mật khẩu đồng bộ');if(g.ok)applySnap((await g.json()).data||{});
    const p=await fetch(url+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:U,token:r.stk,data:snap()})});
    if(!p.ok)throw Error(p.status);ls.set('synt',Date.now());if(!silent)toast('Đã đồng bộ ✓');
  }catch(x){if(!silent)toast('Đồng bộ lỗi: '+x.message)}finally{syncing=false}
}
function syncPage(){
  const o=$('#sub');o.style.display='block';o.scrollTop=0;const t=ls.get('synt',0);
  o.innerHTML=`<div class="tb2"><button class="bk">‹</button><h3>Đồng bộ & sao lưu</h3></div><div class="fm"><p class="mu" style="margin-top:8px;line-height:1.5">${U?'Chạy <b>server.js</b> (Node.js) trên máy/VPS của bạn, nhập địa chỉ bên dưới. Trên mỗi thiết bị, đăng nhập cùng tên đăng nhập và mật khẩu để dùng chung lịch sử, phim thích, theo dõi, nhắc lịch.':'Hãy đăng nhập để dùng đồng bộ. Sao lưu bằng file thì dùng được cả khi chưa đăng nhập.'}</p>
  ${U?`<input id="sy" placeholder="http://192.168.1.10:8787" value="${e(ls.get('syn',''))}"><button class="pb" id="ss">Lưu & đồng bộ ngay</button><p class="mu" style="margin:10px 0;font-size:13px">${t?'Lần cuối: '+new Date(t).toLocaleString('vi-VN'):'Chưa đồng bộ'}</p>`:''}
  <button class="pb" id="sk" style="background:var(--c);color:var(--tx)">⬇ Sao lưu ra file .json</button><label class="pb" style="display:block;text-align:center;background:var(--c);color:var(--tx);cursor:pointer">⬆ Khôi phục từ file<input type="file" id="sf" accept=".json" hidden></label></div>`;
  if($('#ss'))$('#ss').onclick=async()=>{ls.set('syn',$('#sy').value.trim());await sync(false);syncPage()};
  $('#sk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,data:snap()})],{type:'application/json'}));a.download='xemphim-backup.json';a.click()};
  $('#sf').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);applySnap(d.data||d);toast('Đã khôi phục ✓')}catch{toast('File không hợp lệ')}};r.readAsText(f)};
}

/* ===== Điều hướng ===== */
const FEEDS={home:[['moi','Phim mới nhất'],['phim-le','Top 10 phim HOT','top'],['phim-bo','Phim bộ'],['phim-le','Phim lẻ'],['hoat-hinh','Hoạt hình'],['tv-shows','TV Shows']],
  phim:[['phim-bo','Phim bộ'],['phim-le','Phim lẻ'],['the-loai/hanh-dong','Hành động'],['the-loai/tinh-cam','Tình cảm'],['the-loai/co-trang','Cổ trang'],['the-loai/kinh-di','Kinh dị']]};
function render(){
  const t=S.tab;clearInterval(hT);kill();
  document.querySelectorAll('#bn button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#hd').classList.toggle('solid',!['home','phim'].includes(t));setAv();$('#sb').textContent=(S.src==='kk'?'KKPhim':'NguonC')+' ⇄';
  if(t==='home'||t==='phim')feed(FEEDS[t],t==='home');
  else if(t==='cat')$('#main').innerHTML=catH();
  else tvPage(t==='sport');
}
const go=t=>{S.tab=t;render();scrollTo(0,0)};
$('#bn').onclick=ev=>{const b=ev.target.closest('button');if(b)go(b.dataset.t)};
$('#sb').onclick=()=>{S.src=S.src==='kk'?'ng':'kk';ls.set('src',S.src);render();toast('Nguồn: '+(S.src==='kk'?'KKPhim':'NguonC'))};
$('#sr').onclick=searchPage;$('#fl').onclick=filterPage;$('#av').onclick=()=>profilePage();

document.addEventListener('click',async ev=>{
  const t=ev.target,q=s=>t.closest(s);
  if(q('.bk')){if($('#det').style.display==='block')closeDet();else $('#sub').style.display='none';return}
  if(q('[data-f]')){const i=+q('[data-f]').dataset.f,u=CH[i].url;FAV=FAV.includes(u)?FAV.filter(x=>x!==u):[...FAV,u];ls.set('fav',FAV);tvDraw();return}
  if(q('[data-u]')){playTv(+q('[data-u]').dataset.u);scrollTo(0,0);return}
  if(q('[data-g]')){GR=q('[data-g]').dataset.g;tvDraw();return}
  if(q('[data-fl]')){filterPage();return}if(q('[data-go]')){go(q('[data-go]').dataset.go);return}
  if(q('[data-cw]')){const x=ls.get('cw',[])[+q('[data-cw]').dataset.cw];if(x){S.src=x.src;$('#sb').textContent=(S.src==='kk'?'KKPhim':'NguonC')+' ⇄';openDet(x.slug,x.si,x.ei)}return}
  if(q('[data-l]')){const l=q('[data-l]');listPage(l.dataset.l,l.dataset.t);return}
  if(q('[data-ep]')&&C){playEp(C.si,+q('[data-ep]').dataset.ep);return}
  if(q('[data-sv]')&&C){C.si=+q('[data-sv]').dataset.sv;C.ei=0;playEp(C.si,0);return}
  if(q('[data-tb]')&&C){C.tab=q('[data-tb]').dataset.tb;document.querySelectorAll('.tbs span').forEach(x=>x.classList.toggle('on',x===q('[data-tb]')));tabBody();return}
  if(q('#xm')){$('#ds').classList.toggle('x');t.textContent=$('#ds').classList.contains('x')?'Thu gọn':'Xem thêm';return}
  if(q('[data-a]')&&C){
    const a=q('[data-a]').dataset.a;if(a==='fl'){toggleFollow(q('[data-a]'));return}if(a==='rm'){remindSheet();return}
    if(a==='lk'||a==='wl'){const k=a,arr=ls.get(k,[]),has=arr.some(x=>x.slug===C.s);ls.set(k,has?arr.filter(x=>x.slug!==C.s):[{slug:C.s,name:C.d.name,thumb:C.d.thumb,src:S.src},...arr]);const b=q('[data-a]');b.classList.toggle('on',!has);b.querySelector('em').textContent=a==='lk'?(has?'♡':'♥'):(has?'＋':'✓');toast(has?'Đã bỏ':'Đã lưu')}
    else if(a==='dl'){const x=C.d.servers[C.si]?.eps[C.ei];const u=x?.m3u8||x?.embed;u?window.open(u,'_blank'):toast('Không có link')}
    else{const u=location.href.split('#')[0];try{navigator.share?await navigator.share({title:C.d.name,url:u}):(await navigator.clipboard.writeText(u),toast('Đã sao chép link'))}catch{}}
    return}
  if(q('[data-s]')){const el=q('[data-s]');if(el.dataset.src&&el.dataset.src!==S.src){S.src=el.dataset.src;ls.set('src',S.src);$('#sb').textContent=(S.src==='kk'?'KKPhim':'NguonC')+' ⇄'}openDet(el.dataset.s);return}
});
render();if(U)sync(true);
</script>
